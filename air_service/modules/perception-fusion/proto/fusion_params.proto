syntax = "proto2";
package airos.perception.msf;

message KMParams {
    optional double min_score = 1;
}

message Param {
    optional double k = 1;
    optional double b = 2;
}

message SingleCameraParam {
    optional int32 camera_id = 1;
    repeated Param param = 2;
}
enum ConfidenceLevel {
    C90P = 0;
    C95P = 1;
    C975P = 2;
    C99P = 3;
}
message ScoreParams {
    optional int32 type_count = 1;
    optional double max_match_distance = 2;
    optional double min_score = 3;
    optional bool use_mahalanobis_distance = 4 [default = false];
    optional bool check_type = 5 [default = false];
    optional bool check_subtype = 6 [default = false];
    optional ConfidenceLevel confidence_level = 7 [default = C975P];
    optional bool use_fused_object = 8 [default = false];
    optional int32 subtype_count = 9;
    optional double chi_square_critical = 10 [default = 9.4];
    optional bool check_size = 11 [default = false];
    optional double size_diff_tolerance_value = 12 [default = 0.5];
    optional double max_match_distance_diff_subtype = 13 [default = 2.0];
    optional double great_similarity_score= 14 [default = 18.0];
}

message CovarianceParams {
    optional int32 covariance_dim = 1 [default = 2];
    optional bool default_camera_covariance = 2 [default = false];
    optional double scale_factor_first = 3 [default = 1.0];
    optional double scale_factor_second = 4 [default = 1.0];
    optional double scale_factor_third = 5 [default = 1.0];
    optional double occ_state_partial_magnification_x = 6 [default = 1.0];
    optional double occ_state_partial_magnification_y = 7 [default = 1.0];
    optional double occ_state_complete_magnification_x = 8 [default = 1.0];
    optional double occ_state_complete_magnification_y = 9 [default = 1.0];
    optional double trunc_state_partial_magnification_x = 10 [default = 1.0];
    optional double trunc_state_partial_magnification_y = 11 [default = 1.0];
}
message FusionParams {
    repeated SingleCameraParam fusion_params= 1;
    optional KMParams km_params = 2;
    required ScoreParams score_params = 3;
    required CovarianceParams covariance_params = 4;
}